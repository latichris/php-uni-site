<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Ανάλυση Μαθημάτων</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #66ccff, #66ff55);
      padding: 100px;
      text-align: center;
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
    }

    .form-container {
      background-color: #fff;
      padding: 40px;
      border-radius: 10px;
      display: inline-block;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      text-align: center;
    }

    form {
      margin: 20px 0;
    }

    input[type="file"], select {
      margin: 15px 0;
    }

    button {
      padding: 10px 20px;
      background: linear-gradient(135deg, #55bbee, #55ee44);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: linear-gradient(135deg, #2288bb, #22bb11);
    }

    .note {
      margin-top: 20px;
      margin-bottom: 5px;
      color: #777;
      font-size: 0.9em;
    }

    .logo {
      position: absolute;
      top: 20px;
      height: 60px;
    }

    .logo-left {
      max-width: 8%;
      height: auto;
      display: block;
      left: 20px;
    }

    .logo-right {
      max-width: 10%;
      height: auto;
      display: block;
      right: 20px;
    }
  </style>
</head>
<body>
  <img src="logo1.svg" alt="Logo 1" class="logo logo-left">
  <img src="logo2.png" alt="Logo 2" class="logo logo-right">
  <div class="form-container">
    <h1>Ανεβάστε το Excel με τα μαθήματα</h1>

    <form id="uploadForm" action="analyze.php" method="POST" enctype="multipart/form-data">
      <input type="file" name="excel" id="excel" accept=".xlsx,.xls" required>
      <br>


      <button type="submit">Ανάλυση</button>
    </form>

    <div class="note">
      Το αρχείο Excel των μαθημάτων βρίσκεται στην ιστοσελίδα classweb.
      <br>
      Παρακαλώ μην αλλοιώσετε τα περιεχόμενα του Excel.
      <br>
      <br>
      <br>
      <br>
      <i>Πρόγραμμα και ιστοσελίδα από τον Χρήστο Λατινόπουλο</i>
    </div>
  </div>

  <script>
    document.getElementById("uploadForm").addEventListener("submit", function(event) {
        this.action = "analyze.php";
    });
  </script>
</body>
</html>
